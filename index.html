<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunkinSheet Optimizer</title>
    <link rel="icon" type="image/png" href="ico.png?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/1.0.11/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <h2>⚡ FunkinSheet Optimizer <span class="author">by NickENS'</span></h2>
    
    <!-- Верхние вкладки -->
    <div class="top-tabs">
        <button id="top-all" class="top-tab-btn active" onclick="setTopMode('all')">⭐ All Sprites</button>
        <button id="top-character" class="top-tab-btn beta" onclick="setTopMode('character')">👾 Characters [Beta]</button>
        <button id="top-stage" class="top-tab-btn beta" onclick="setTopMode('stage')">🌆 Stages [Beta]</button>
    </div>

    <!-- Нижние подвкладки (контейнер) -->
    <div id="sub-tabs-container">
        <div class="tabs" id="subTabs">
            <button id="btn-sprite" class="tab-btn" onclick="setSubMode('sprite')">Sprite</button>
            <button id="btn-xml" class="tab-btn active" onclick="setSubMode('xml')">SpriteSheet</button>
            <button id="btn-json" class="tab-btn" onclick="setSubMode('json')">SpriteMap</button>
        </div>
    </div>

    <div class="box">
        <label id="first-label">1. PNG файл:</label>
        <input type="file" id="pngInput" accept="image/png" onchange="previewPng()">
        <div id="pngPreview" class="preview-box">
            <img id="pngImgPreview" src="" alt="PNG Preview">
            <div class="file-info" id="pngInfo"></div>
        </div>

        <div id="xml-container">
            <label>2. XML файл:</label>
            <input type="file" id="xmlInput" accept=".xml" onchange="previewDataFile('xml')">
        </div>

        <div id="json-container" style="display: none;">
            <label>2. Атлас (spritemap.json):</label>
            <input type="file" id="jsonAtlasInput" accept=".json">
            
            <label>3. Анимация (Animation.json):</label>
            <input type="file" id="jsonAnimInput" accept=".json">
        </div>

        <div id="dataPreview" class="preview-box">
            <span class="icon-badge">📄</span>
            <div class="file-info" id="dataInfo"></div>
        </div>

        <!-- Блок experimental для Characters -->
        <details id="character-data-container" class="char-details" style="display: none;">
            <summary>
                <span class="summary-text">
                    <span class="summary-title">[Experimental]</span>
                    <span class="summary-sub">Масштабирование конфигурации "data/character"</span>
                </span>
            </summary>
            <div class="char-content">
                <label style="margin-top: 0;">Файл character'a (.xml):</label> <!-- .json / .xml -->
                <input type="file" id="charDataInput" accept=".xml" onchange="previewDataFile('charData')"> <!-- .xml,.json -->
                
                <label>Движок (формат масштабирования):</label>
                <select id="engineSelectChar">
                    <option value="codename">Codename Engine (XML)</option>
                </select>
                <div class="hint-text" style="margin-top: 8px;">
                    💡 Файл будет сохранён в папке <b>character data</b>.
                </div>
            </div>
        </details>

        <!-- Блок experimental для Stages -->
        <details id="stage-data-container" class="char-details" style="display: none;">
            <summary>
                <span class="summary-text">
                    <span class="summary-title">[Experimental]</span>
                    <span class="summary-sub">Масштабирование конфигурации "data/stage"</span>
                </span>
            </summary>
            <div class="char-content">
                <label style="margin-top: 0;">Файл stage (.xml):</label>
                <input type="file" id="stageDataInput" accept=".xml" onchange="previewDataFile('stageData')">
                
                <label>Движок (формат масштабирования):</label>
                <select id="engineSelectStage">
                    <option value="codename">Codename Engine (XML)</option>
                </select>
                <div class="hint-text" style="margin-top: 8px;">
                    💡 Файл будет сохранён в папке <b>stage data</b>.
                </div>
            </div>
        </details>

        <label>Масштаб (1 = ничего | 0.5 = в 2 раза меньше | 0.25 = в 4 раза меньше):</label>
        <input type="text" id="scaleInput" value="0.5" placeholder="0.5">

        <label>Оптимизация веса PNG (Квантизация):</label>
        <div class="opt-container">
            <label class="checkbox-label">
                <input type="checkbox" id="compressCheck" onchange="toggleCompressOptions()">
                Включить сжатие палитры
            </label>

            <div id="rangeBox" class="range-box">
                <label style="font-size: 0.85em; font-weight: normal;">
                    Лимит цветов: <strong id="colorsVal">256</strong>
                </label>
                <input type="range" id="colorsRange" min="32" max="256" step="32" value="256" oninput="document.getElementById('colorsVal').innerText = this.value; updateHint();">
                <div class="hint-text" id="compressHint">
                    💡 <strong>256 цветов:</strong> Высокое качество сжатия.
                </div>
            </div>
        </div>

        <label>Имя итогового файла:</label>
        <input type="text" id="nameInput" placeholder="Оставьте пустым для оригинала">

        <button onclick="processFiles()">Обработать и Скачать ZIP</button>
    </div>
    <div id="log"></div>
</body>
</html>
